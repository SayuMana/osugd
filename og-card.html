<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #1a1226;
        color: #e8dff5;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        display: flex;
        align-items: center;
        padding: 80px;
      }
      .frame {
        width: 100%;
        height: 100%;
        border: 1px solid #3f2c57;
        border-radius: 8px;
        padding: 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 22px;
        color: #b9a9d0;
      }
      .dot {
        width: 34px;
        height: 34px;
        border-radius: 4px;
        background: #1a1226;
        border: 1px solid #f1aa00;
        color: #f1aa00;
        font-family: "IBM Plex Mono", monospace;
        font-size: 17px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 24px;
      }
      p {
        font-size: 24px;
        line-height: 1.45;
        color: #b9a9d0;
        max-width: 820px;
      }
      .foot {
        font-family: "IBM Plex Mono", monospace;
        font-size: 18px;
        color: #b9a9d0;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <span class="mark"><span class="dot">gd</span>osugd</span>
      <div>
        <h1>Guest difficulty log</h1>
        <p>A log of guest difficulties: the map each one went on, its status, and its star rating.</p>
      </div>
      <span class="foot">osu! guest difficulties · status and star rating</span>
    </div>
  </body>
</html>
